              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '405': 
          description: Method Not Allowed
          headers:
            allow:
              description: (mandatory) Allowed HTTP methods for this endpoint
              required: true
              schema:
                type: string
                example: "POST, GET"
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'

        '500':
          description: Internal Error - retriable
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'

components:
  headers:
    Location:
      description: (mandatory) The relative path of the newly created order request item
      required: true
      schema:
        type: string
        maxLength: 64
        example: "/serviceOrder/43429a61f5f54ad4aec05a68d28b1350"
    Accept:
      description: (mandatory) Supported media types
      required: true
      schema:
        type: string
        enum: [application/json]
        example: "application/json"
    Msg_ctx_src:
      description: (mandatory) Name of the source system, the sender party of the message. This is used primarily for gathering information on services usage. The name should contain a human-readable name of the application
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9-_.]+$'
        maxLength: 64
        example: "LIGW"
    Msg_ctx_src_module:
      description: (optional) Name of the source system's module which sent the message. Fill only if suitable
      required: false
      schema:
        type: string
        pattern: '^[a-zA-Z0-9-_.]+$'
        maxLength: 64
        example: null
    Msg_ctx_env:
      description: (mandatory) Identifier of the environment. If the environment is production, use the value 'prod'. Otherwise, use the proper string value which describes the environment (uat|uat8|uat13|uat15|test|tst1|tst2|dev|demo)
      required: true
      schema:
        type: string
        pattern: '^(prod|uat|uat8|uat13|uat15|test|tst1|tst2|dev|demo)$'
        example: "prod"
    Msg_ctx_id:
      description: (mandatory) In case of regular responses, this field must contain the ID of the message, which to it answers. Messaging infrastructure permits the usage of multiple answers for the same request. The specific service / interface definitions should mark if this capability is used by the actual implementation
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        example: "53329a61-f5f5-4ad4-aec0-5a68d28b1350"
    Msg_ctx_corr_id:
      description: (mandatory) It intends to hold a flow (or session) identifier. The flow initiator generates the id, any other party should copy the received id into all subsequent messages/calls inside the flow. Ids should be unique for each and every flow
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        example: "3385cbdb-8561-48f6-a671-5e271f486a41"
    Msg_ctx_build_number:
      description: (optional) It represents the sender application's build version
      required: false
      schema:
        type: string
        pattern: '^[a-zA-Z0-9-_.]+$'
        maxLength: 16
        example: "3.1.0"
  responses:
    '400':
      description: Bad request
      content:
        application/json:
          schema:
           $ref: '#/components/schemas/oError_response'
          example: 
            error_code: 400
            error_description: Invalid input
    '404':
      description: User not found
      content:
        application/json:
          schema:
           $ref: '#/components/schemas/oError_response'
          example: 
            error_code: 404
            error_description: Data not found
    '405':
      description: Method not allowed
      content:
        application/json:
          schema:
           $ref: '#/components/schemas/oError_response'
          example: 
            error_code: 405
            error_description: Delete operation not allowed
    '409':
      description: User already exists
      content:
        application/json:
          schema:
           $ref: '#/components/schemas/oError_response'
          example: 
            error_code: 409
            error_description: User already exists
    '500':
      content:
        application/json:
          schema:
           $ref: '#/components/schemas/oError_response'
          example: 
            error_code: 500
            error_description: Internal server error
      description: Internal server error
  parameters:
    msgcntx_src:
      name: Msg-Ctx-Src
      description: 'Name of the source system, the sender party of the message (e.g ApplicationId)'
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: MIRA
    msgcntx_srcmodule:
      name: Msg-Ctx-Src-Module
      description: 'Optional, name of the source system’s module which sent the message'
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: mira_xtv
    msgcntx_env:
      name: Msg-Ctx-Env
      description: 'Identifier of the environment (e.g. UAT, PROD).'
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
      example: UAT15
    msgcntx_id:
      name: Msg-Ctx-Id
      description: UUID of the message like 'f257ba6675cf4921affa5fb06f5ca20e'
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
      example: f257ba6675cf4921affa5fb06f5ca20e
    msgcntx_corelid:
      name: Msg-Ctx-Corr-Id
      description: UUID that intends to hold a flow (or session) identifier. The flow initiator generates the id.
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
      example: 23asf33JOISA-sad4329
    msgcntx_userid:
      name: Msg-Ctx-User-Id
      description: Optional value of the original user that initiated the action.
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: teszt.elek
    user_uuid_path:
      in: path
      name: user_uuid
      description: Uuid of the user account
      required: true
      schema:
        $ref: '#/components/schemas/sUser_uuid'
      example: 9d16b45c-cb38-4187-a13e-75995dfc0e98
    user_uuid:
      in: query
      name: uuid
      description: Uuid of the user account (either uuid or msisdn is required)
      schema:
        $ref: '#/components/schemas/sUser_uuid'
      example: 9d16b45c-cb38-4187-a13e-75995dfc0e98
    user_msisdn:
      in: query
      name: msisdn
      description: MSISDN of the user (either uuid or msisdn is required)
      schema:
        $ref: '#/components/schemas/sMsisdn'
      example: 36201234567
    from_date:
      in: query
      name: from-date
      description: Start date of the query
      schema:
        $ref: '#/components/schemas/date'
    to_date:
      in: query
      name: end-date
      description: End date of the query
      schema:
        $ref: '#/components/schemas/date'
    result:
      in: query
      name: result
      description: Result of the transaction
      schema:
        $ref: '#/components/schemas/sResult'
      example: ALL
    offset:
      in: query
      name: offset
      description: Offset starts from 0 value which represents the first element
      schema:
        type: integer
      example: 0
    count:
      in: query
      name: count
      description: Page size
      schema:
        type: integer
      example: 50
    provider_id:
      in: path
      name: provider_id
      required: true
      description: >
       * `TV2` - TV2 Play Premium
       
       * `RTL` - RTL+ Active
       
       * `HBO` - HBO Max
      schema:
        type: string
        enum: [TV2,RTL,HBO]
    Msg_ctx_src:
      name: msg-ctx-src
      description: Name of the source system, the sender party of the message. This is used primarily for gathering information on services usage. The name should contain a human-readable name of the application
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: '^[a-zA-Z0-9-_.]+$'
        example: "SOMA"
    Msg_ctx_src_module:
      name: msg-ctx-src-module
      description: Optional, name of the source system's module which sent the message. Fill only if suitable
      in: header
      required: false
      schema:
        type: string
        pattern: '^[a-zA-Z0-9-_.]+$'
        maxLength: 64
        example: "SOMA_1.1"
    Msg_ctx_env:
      name: msg-ctx-env
      description: Identifier of the environment. If the environment is production, use the value 'prod'. Otherwise, use the proper string value which describes the environment (uat|uat8|uat13|uat15|test|tst1|tst2|dev|demo)
      in: header
      required: true
      schema:
        type: string
        pattern: '^(prod|uat|uat8|uat13|uat15|test|tst1|tst2|dev|demo)$'
        example: "prod"
    Msg_ctx_id:
      name: msg-ctx-id
      description: Unique identifier of the message. The calling party must guarantee this being a unique identifier (UUID, GUID, etc.)
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        example: "53329a61-f5f5-4ad4-aec0-5a68d28b1350"
    Msg_ctx_corr_id:
      name: msg-ctx-corr-id
      description: It intends to hold a flow (or session) identifier. The flow initiator generates the id, any other party should copy the received id into all subsequent messages/calls inside the flow. Ids should be unique for each and every flow
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        example: "3385cbdb-8561-48f6-a671-5e271f486a41"
    Msg_ctx_build_number:
      name: msg-ctx-build-number
      description: It represents the sender application's build version
      in: header
      required: false
      schema:
        type: string
        pattern: '^[a-zA-Z0-9-_.]+$'
        maxLength: 16
        example: "release_20250516"
    Msg_ctx_user_id:
      name: msg-ctx-user-id
      description: Optional value of the original user that initiated the action.
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: '^[a-zA-Z0-9-_.]+$'
        example: "oper"
  schemas:
    date:
      type: string
      format: date
      example: '2022-10-29'
    timestamp:
      type: string
      format: date-time
      example: '2022-10-29T09:12:33.001Z'
    sMsgcntx_rrid:
      type: string
      minLength: 1
      maxLength: 40
      example: 23asf33JOISA-sad4329
    sUser_uuid:
      type: string
      maxLength: 64
      example: d290f1ee-6c54-4b01-90e6-d701748f0851
    oUser:
      type: object
      allOf:
        - $ref: '#/components/schemas/oCreate_user'
        - type: object
          properties:
            reservation_ts:
              type: string
              format: date-time
              example: '2022-10-29T09:12:33.001Z'
    oCreate_user:
      type: object
      properties:
        user_uuid:
          $ref: '#/components/schemas/sUser_uuid'
        msisdn:
          type: string
          example: 36201234567
        data:
          type: string
          example: 'salesman:S1;dealer:D2;élet_értelme:42'
    sResult:
      type: string
      enum:
        - ALL
        - SUCCESS
        - FAILED
    oUserExtended:
      type: object
      description: XTV related data of user. Each parameter can be empty
      properties:
        user_uuid:
          $ref: '#/components/schemas/sUser_uuid'
        msisdn:
          $ref: '#/components/schemas/sMsisdn'
        preactivation_ts:
          $ref: '#/components/schemas/timestamp'
        kaltura_user_id:
          type: string
          maxLength: 64
          example: 9d16b45c-cb38-4187-a13e-75995dfc0e98
        kaltura_ts_create:
          $ref: '#/components/schemas/timestamp'
        kaltura_ts_delete:
          $ref: '#/components/schemas/timestamp'
        kaltura_status:
          $ref: '#/components/schemas/sUser_status'
        providers:
          type: array
          items:
              properties:
                provider_id:
                  type: string
                  enum: [HBO,RTL,TV2]
                code:
                  type: string
                  maxLength: 64
                  example: gsk8sdwisd87
                customer_id:
                  type: string
                  maxLength: 64
                  example: 212021234
                ts_create:
                  $ref: '#/components/schemas/timestamp'
                ts_delete:
                  $ref: '#/components/schemas/timestamp'
                ts_register:
                  $ref: '#/components/schemas/timestamp'
                ts_commit:
                  $ref: '#/components/schemas/timestamp'
                status:
                  $ref: '#/components/schemas/sUser_status'
    oUser_with_trx:
      type: object
      description: XTV related data of user with transactions. 
      allOf:
        - $ref: '#/components/schemas/oUserExtended'
        - type: object
          properties:
            transactions:
              $ref: '#/components/schemas/aTransactions'
    sUser_status:
      type: string
      enum:
        - NEW
        - ACTIVE
        - SUSPENDED
        - DELETED
      example: ACTIVE
    sMsisdn:
      type: string
      maxLength: 16
      example: 36201234567
    aTransactions:
     type: array
     items:
      $ref: '#/components/schemas/oTransaction'
    oTransaction:
      type: object
      required:
        - xtvgw_id
        - request_type
        - request_ts
        - trx_ts_start
        - trx_ts_close
      properties:
        external_id:
          type: string
          maxLength: 64
          example: 23asf33JOISA-sad4329
        xtvgw_id:
          type: number
          format: int64
          example: 400321213
        source:
          type: string
          description: Source system can be NC, MIRA, TSSM
          maxLength: 64
          example: NC
        provider_id:
          type: string
          enum: [KALTURA,TV2,RTL,HBO,XGW]
          description: >
             * `KALTURA` - Base xtv package
             
             * `TV2` - TV2 Play Premium
             
             * `RTL` - RTL+ Active
             
             * `HBO` - HBO Max
             
             * `XGW` - can be used in case of changeCtn and changeUuid
        request_type:
          type: string
          description: |
            Kaltura request types: create_user, delete_user, modify_user, restore_user, suspend_user, update_uuid, update_msisdn
          
            TV2 request types: create_user, validate_user, delete_user, restore_user, suspend_user, resend_voucher, swap_voucher
            
            RTL request types: create_user, delete_user, resume_user, suspend_user, resend_coupon, swap_coupon
            
            HBO request types: create_user, validate_user, delete_user, resume_user, suspend_user, resend_reg_code, swap_reg_code
          
          enum: [create_user,delete_user,modify_user,restore_user,suspend_user,update_uuid,update_msisdn,resend_voucher,swap_voucher,resend_coupon,swap_coupon,resend_reg_code,swap_reg_code,validate_user]
        request_ts:
          $ref: '#/components/schemas/timestamp'
        trx_ts_start:
          $ref: '#/components/schemas/timestamp'
        trx_ts_close:
          $ref: '#/components/schemas/timestamp'
        user_uuid:
          $ref: '#/components/schemas/sUser_uuid'
        msisdn:
          $ref: '#/components/schemas/sMsisdn'
        error_code:
          type: number
          example: 0
        error_description:
          type: string
          maxLength: 64
          example: Success transaction
        email:
          type: string
          format: email
          example: user@mail.hu
        request_related_data:
          type: array
          items:
            $ref: '#/components/schemas/oRequest_data'
        workflow_history:
          type: array
          items:
            properties:
              step_type:
                type: string
                description: |
                  General steps: Send request, Create transaction, Close transaction, Send SMS, Send email, Update SOC parameters
                  
                  Kaltura steps: Register customer, Add core product, Add product, Add set-top-box, Delete set-top-box, Delete user, Swap core product, Swap product, Delete product, Delete user pin, Delete set-top-box pin, Suspend user, Update user
                  
                  RTL steps: Generate coupon, RTL revoke coupon
                  
                  TV2 steps: Generate voucher, Suspend voucher, Revoke voucher, Restore voucher, TV2 register user
                  
                  HBO steps: HBO register user
              request_ts:
                $ref: '#/components/schemas/timestamp'
              result:
                type: string
                description: Result of the communication (SUCCESS, FAILED)
                example: SUCCESS
      example: {"external_id":"23asf33JOISA-sad4329","xtvgw_id":400321213,"source":"NC","provider_id":"KALTURA","request_type":"create_user","request_ts":"2022-11-23T17:09:04.001Z","trx_ts_start":"2022-11-23T17:09:04.111Z","trx_ts_close":"2022-11-23T17:09:14.001Z","user_uuid":"d290f1ee-6c54-4b01-90e6-d701748f0851","msisdn":"36201234567","error_code":1021,"error_description":"Get email address failed","email":"","request_related_data":[{"add_core_product":{"id":"34206","status":"SUCCESS"},"add_products":[{"id":"34210","status":"SUCCESS"},{"id":"34211","status":"SUCCESS"}],"add_settopboxes":[{"id":"1001:1a1b:1234:cd00:10a4:8824:eb05:abc","status":"SUCCESS"},{"id":"1002:1a1b:1234:cd00:10a4:8824:eb05:abc","status":"SUCCESS"}]}],"workflow_history":[{"step_type":"Send request","request_ts":"2022-11-23 17:09:04.001Z","result":"SUCCESS"},{"step_type":"Create transaction","request_ts":"2022-11-23 17:09:04.111Z","result":"SUCCESS"},{"step_type":"Register customer","request_ts":"2022-11-23 17:09:05.001Z","result":"SUCCESS"},{"step_type":"Add core product","request_ts":"2022-11-23 17:09:07.001Z","result":"SUCCESS"},{"step_type":"Add product","request_ts":"2022-11-23 17:09:08.001Z","result":"SUCCESS"},{"step_type":"Add set-top-box","request_ts":"2022-11-23 17:09:11.001Z","result":"SUCCESS"},{"step_type":"Send SMS","request_ts":"2022-11-23 17:09:13.001Z","result":"SUCCESS"},{"step_type":"Close transaction","request_ts":"2022-11-23 17:09:14.001Z","result":"SUCCESS"}]}
    eStatus:
      type: string
      enum: [SUCCESS,FAILED]
    oRequest_data:
      type: object
      anyOf:
        - type: object
          properties:
            add_core_product:
              $ref: '#/components/schemas/oAdd_core_product'
        - type: object
          properties:
            add_products:
              $ref: '#/components/schemas/aAdd_products'
        - type: object
          properties:
            add_settopboxes:
              $ref: '#/components/schemas/aAdd_STBs'
        - type: object
          properties:
            swap_core_product:
              $ref: '#/components/schemas/oSwap_core_product'
        - type: object
          properties:
            swap_products:
              $ref: '#/components/schemas/oSwap_products'
        - type: object
          properties:
            del_core_product:
              $ref: '#/components/schemas/oDel_core_product'
        - type: object
          properties:
            del_products:
              $ref: '#/components/schemas/oDel_products'
        - type: object
          properties:
            del_settopboxes:
              $ref: '#/components/schemas/aDel_STBs'
        - type: object
          properties:
            change_uuid:
              $ref: '#/components/schemas/oChange_uuid'
        - type: object
          properties:
            change_msisdn:
              $ref: '#/components/schemas/oChange_msisdn'
        
    oAdd_core_product:
      type: object
      properties:
        id:
          type: string
          example: 21321
        status:
          $ref: '#/components/schemas/eStatus'
    aAdd_products:
      type: array
      items:
        properties:
          id:
            type: string
            example: 21321
          status:
            $ref: '#/components/schemas/eStatus'
    aAdd_STBs:
      type: array
      items:
        properties:
          id:
            type: string
            format: mac_address
            description: MAC address
            example: 1002:1a1b:1234:cd00:10a4:8824:eb05:abc
          status:
            $ref: '#/components/schemas/eStatus'
    oSwap_core_product:
      type: object
      properties:
        old_id:
          type: string
          example: 21321
        new_id:
          type: string
          example: 21322
        status:
          $ref: '#/components/schemas/eStatus'
    oSwap_products:
      type: array
      items:
        properties:
          old_id:
            type: string
            example: 21321
          new_id:
            type: string
            example: 21322
          status:
            $ref: '#/components/schemas/eStatus'
    oDel_core_product:
      type: object
      properties:
        id:
          type: string
          example: 21321
        status:
          $ref: '#/components/schemas/eStatus'
    oDel_products:
      type: array
      items:
        properties:
          id:
            type: string
            example: 21321
          status:
            $ref: '#/components/schemas/eStatus'
    aDel_STBs:
      type: array
      items:
        properties:
          id:
            type: string
            description: MAC address
            example: 1002:1a1b:1234:cd00:10a4:8824:eb05:abc
          status:
            $ref: '#/components/schemas/eStatus'
    oChange_uuid:
      type: object
      properties:
        old_uuid:
          type: string
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        new_uuid:
          type: string
          example: fe6e1045-0f54-4d5b-9935-921012616301
    oChange_msisdn:
      type: object
      properties:
        old_msisdn:
          type: string
          example: 36201234567
        new_msisdn:
          type: string
          example: 36209876543
    oError_response:
      type: object
      properties:
          error_code:
            type: number
            minimum: 0
            description: Error code
            example: 2002
          error_description:
            type: string
            minLength: 0
            maxLength: 64
            description: Error description
            example: Retriable error
    BaseOrder:
      type: object
      properties:
        externalId:
          type: string
          description: Client-provided transaction identifier
        category:
          type: string
          description: Optional high-level category of the service (e.g., tv)
        description:
          type: string
          description: Optional description of the operation
    BaseOrderItem:
      type: object
      properties:
        id:
          type: string
          description: Client-supplied line id
        action:
          type: string
          description: Action to be performed on the item
          enum: [add, modify, noChange, delete]
    BaseService:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the service, service Inventory ID (e.g., CS_CYA000000002169126)
        serviceSpecification:
          type: object
          description: Service specification reference
          required: [ id ]
          properties:
            id:
              type: string
              description: CFS specification id (e.g., CFS_YettelAccount, CFS_TV, CFS_StreamingService, CFS_PhoneNumber, CFS_STB)
        name:
          type: string
          description: Human-friendly service name (e.g., "TVPLATFORM", "HBO Max")
        serviceType:
          type: string
          description: Provider id or ACCOUNT in case of the yettel account
          enum: [HBO, RTL, TV2, ACCOUNT, TVPLATFORM]
        state:
          type: string
          enum: [ active, suspended, terminated ]
    OrderRequest:
      required: [externalId, orderItem, notificationEndPoint]
      allOf:
      - $ref: '#/components/schemas/BaseOrder'
      - type: object
        properties:
          notificationEndPoint:
            type: string
            format: uri
            description: Callback URL for async responses
          orderItem:
            type: array
            description: A list of service order items to be processed by this operation
            minItems: 1
            items:
              required: [id, action, service]
              allOf:
              - $ref: '#/components/schemas/BaseOrderItem'
              - type: object
                properties:
                  service:
                    description: The service to be acted on by the order item
                    required: [id, serviceType, href]
                    allOf:
                    - $ref: '#/components/schemas/BaseService'
                    - type: object
                      properties:
                        href:
                          type: string
                          format: uri
                          description: Service Inventory href
                          example: https://host/ngsf/si/serviceInventoryManagement/service/CS_CYA000000002169126
                        serviceCharacteristic:
                          type: array
                          items:
                            type: object
                            required: [name, value]
                            properties:
                              name:
                                type: string
                                description: |
                                  Name of the characteristic.
                                  Known names include:
                                    - msisdn (string)
                                    - coreProductId (string)
                                    - tvId (string)
                                    - productIdList (array of string in request; array of objects with status in callback/get)
                                    - addProductIdList (only modify, array of string in request; array of objects with status in callback/get)
                                    - deleteProductIdList (only modify, array of string in request; array of objects with status in callback/get)
                                    - ottCoupon (string)
                                    - streamingExternalId (string)
                              value:
                                description: Flexible value holder (scalar/object/array)
                                oneOf:
                                  - type: string
                                  - type: number
                                  - type: integer
                                  - type: boolean
                                  - type: array
                                    items:
                                      oneOf:
                                        - type: string
                                        - $ref: '#/components/schemas/SwapProductDetail'
                                  - $ref: '#/components/schemas/SwapProductDetail'
                                  - type: object
                                    additionalProperties: true
                              
    OrderQuery:
      required: [id,externalId, orderItem]
      allOf:
      - $ref: '#/components/schemas/BaseOrder'
      - type: object
        properties:
          id:
            type: string
            description: Order id on gw side
            maxLength: 40
            example: 43429a61f5f54ad4aec05a68d28b1350
          href:
            description: (mandatory) The relative path of the newly created order request item
            type: string
            maxLength: 64
            example: "/serviceOrder/43429a61f5f54ad4aec05a68d28b1350" 
          state:
            type: string
            description: Possible values for the state of the order
            enum: [acknowledged, inProgress, rejected, cancelled, completed, failed, partial]
          completionDate:
            type: string
            format: date-time
            description: Effective delivery date amended by the provider
          orderDate:
            type: string
            format: date-time
          requestDate:
            type: string
            format: date-time
          orderItem:
            type: array
            description: A list of service order items to be processed by this operation
            minItems: 1
            items:
              required: [id, action, service]
              allOf:
              - $ref: '#/components/schemas/BaseOrderItem'
              - type: object
                properties:
                  state:
                    type: string
                    description: Possible values for the state of the order
                    enum: [acknowledged, inProgress, rejected, cancelled, completed, failed, partial]
                  completionDate:
                    type: string
                    format: date-time
                    description: Effective delivery date
                  error:
                    type: object
                    required: [code]
                    properties:
                      code:
                        description: Custom application error code for localization and troubleshooting
                        type: string
                        example: "9999"
                      detail:
                        description: A detailed human-readable explanation of the issue
                        type: string
                  service:
                    description: The service to be acted on by the order item
                    required: [id, serviceType]
                    allOf:
                    - $ref: '#/components/schemas/BaseService'
                    - type: object
                      properties:
                        serviceCharacteristic:
                          type: array
                          items:
                            type: object
                            required: [name, value]
                            properties:
                              name:
                                type: string
                                description: |
                                  Name of the characteristic.
                                  Known names include:
                                    - msisdn (string)
                                    - coreProductId (string)
                                    - tvId (string)
                                    - productIdList (array of string in request; array of objects with status in callback/get)
                                    - addProductIdList (only modify, array of string in request; array of objects with status in callback/get)
                                    - deleteProductIdList (only modify, array of string in request; array of objects with status in callback/get)
                                    - ottCoupon (string)
                                    - streamingExternalId (string)
                              value:
                                description: Flexible value holder (scalar/object/array)
                                oneOf:
                                  - type: string
                                  - type: number
                                  - type: integer
                                  - type: boolean
                                  - type: array
                                    items:
                                      oneOf:
                                        - type: string
                                        - $ref: '#/components/schemas/CharacteristicResult'
                                        - $ref: '#/components/schemas/SwapProductDetail'
                                        - $ref: '#/components/schemas/SwapProductResult'
                                  - $ref: '#/components/schemas/SwapProductResult'
                                  - type: object
                                    additionalProperties: true
    
    # Request: swap detail
    SwapProductDetail:
      type: object
      required: [oldValue, newValue]
      properties:
        oldValue:
          type: string
          description: Old product ID
          example: "21022"
        newValue:
          type: string
          description: New product ID
          example: "21025"

    # callback/get: swap with status
    SwapProductResult:
      allOf:
        - $ref: '#/components/schemas/SwapProductDetail'
        - type: object
          properties:
            status:
              type: string
              enum: [SUCCESS, FAILED, IN_PROGRESS]
              description: Execution result of the swap

    # callback/get: generic init/add/modify element with status
    CharacteristicResult:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          description: Identifier of the element (productId)
        status:
          type: string
          enum: [SUCCESS, FAILED, IN_PROGRESS]
          description: Execution result of this element

    Problem:
      description: Detailed result for server-side errors
      type: object
      required:
        - title
        - status
        - code
      properties:
        type:
          description: A URI identifying the type of the problem (e.g., resource-not-found); defaults to "about:blank"
          type: string
          format: uri
          example: "https://example.com/problems/resource-not-found"
          default: "about:blank"
        title:
          description: A short, human-readable summary of the problem type
          type: string
          example: "Internal server error"
        status:
          description: HTTP status code
          type: number
          example: 500
        detail:
          description: A detailed human-readable explanation of the issue
          type: string
        instance:
          description: URI of the problematic resource or endpoint
          type: string
          format: uri
          example: "/serviceOrder/12345"
        code:
          description: Custom application error code for localization and troubleshooting
          type: string
          example: "1004"

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic