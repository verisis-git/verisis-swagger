components:
  headers:
    Msg_ctx_src:
      description: (mandatory) Name of the source system, the sender party of the message. This is used primarily for gathering information on services usage. The name should contain a human-readable name of the application
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[a-zA-Z0-9-_]+$'
        example: "SESAME"
    Msg_ctx_env:
      description: (mandatory) Identifier of the environment. If the environment is production, use the value 'PROD'. Otherwise, use any string value which describes the environment (eg. 'UAT2')
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: '^[a-z0-9-]+$'
        example: "prod"
    Msg_ctx_id:
      description: (mandatory) Unique identifier of the message. The calling party must guarantee this being a unique identifier (UUID, GUID, etc.)
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
        pattern: '^[0-9a-f]{16}$|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        example: "6b5fae5a-da07-4864-9683-ce55207d06af"
    Msg_ctx_corr_id:
      description: (mandatory) It intends to hold a flow (or session) identifier. The flow initiator generates the id, any other party should copy the received id into all subsequent messages/calls inside the flow. Ids should be unique for each and every flow
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        example: "3385cbdb-8561-48f6-a671-5e271f486a41"
  parameters:
    Msg_ctx_src:
      name: msg-ctx-src
      description: Name of the source system, the sender party of the message. This is used primarily for gathering information on services usage. The name should contain a human-readable name of the application
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[a-zA-Z0-9-_]+$'
        example: "SESAME"
    Msg_ctx_env:
      name: msg-ctx-env
      description: Identifier of the environment. If the environment is production, use the value 'PROD'. Otherwise, use any string value which describes the environment (eg. 'UAT2')
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: '^[a-z0-9-]+$'
        example: "prod"
    Msg_ctx_id:
      name: msg-ctx-id
      description: Unique identifier of the message. The calling party must guarantee this being a unique identifier (UUID, GUID, etc.)
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
        pattern: '^[0-9a-f]{16}$|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        example: "53329a61-f5f5-4ad4-aec0-5a68d28b1350"
    Msg_ctx_corr_id:
      name: msg-ctx-corr-id
      description: It intends to hold a flow (or session) identifier. The flow initiator generates the id, any other party should copy the received id into all subsequent messages/calls inside the flow. Ids should be unique for each and every flow
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        example: "3385cbdb-8561-48f6-a671-5e271f486a41"
  schemas:
    BasicSubscriber:
      type: object
      properties:
        adultContentBan:
          type: boolean
        blockServiceCategories:
          type: array
          example:
            - GOODS
          items:
            type: string
        moSmsBan:
          type: boolean
        msisdn:
          type: string
          example: 36201234567
        paymartBan:
          type: boolean
        paymartService:
          type: boolean
        status:
          type: string
          example: ACTIVE
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
        stickyBitDateTime:
          type: string
          example: yyyy-MM-dd HH:mm:ss
      title: BasicSubscriber
    Subscriber:
      type: object
      properties:
        adultContentBan:
          type: boolean
        blockServiceCategories:
          type: array
          example:
            - GOODS
          items:
            type: string
        customerType:
          type: string
          enum:
            - BUSINESS
            - SELFEMPLOYEE
            - INDIVIDUAL
            - UNKNOWN
        moSmsBan:
          type: boolean
        msisdn:
          type: string
          example: 36201234567
        paymartBan:
          type: boolean
        paymartService:
          type: boolean
        subscriptionType:
          type: string
          enum:
            - PREPAID
            - POSTPAID
            - UNKNOWN
        status:
          type: string
          example: ACTIVE
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
        stickyBitDateTime:
          type: string
          example: yyyy-MM-dd HH:mm:ss
        subsId:
          type: integer
          format: int64
        imsi:
          type: string
          description: IMSI of the SIM card. Present only when includeImsi=true.
          example: 216238432983
      title: Subscriber
  securitySchemes:
    x-api-key:
      type: apiKey
      name: x-api-key
      in: header