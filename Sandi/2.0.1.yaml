openapi: 3.0.0
info:
  title: Communication API
  description: 'This logical swg is created to fulfill the Customer Communication HUB (CCHUB) requirements.'
  version: '2.0.1'
servers:
  - url: 'https://api.yettel.hu/CCHUB/communication-management/v2/'
paths:
  /communication-messages:
    get:
      operationId: listSentCommunicationMessages
      summary: List of communication messages.
      tags:
        - communicationMessage
      parameters:
        - name: context
          in: query
          description: Message context.
          style: form
          explode: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: int-trx-id
          in: query
          description: CCHub ID of the POST request.
          style: form
          explode: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: channel
          in: query
          description: Message channel.
          style: form
          explode: false
          schema:
            type: string
            enum:
              - SMS
              - EMAIL
              - PUSH
              - INBOX
        - name: receiver-app-user-id
          in: query
          schema:
            type: string
            maxLength: 256
          description: ID of the mobile app user or push token
        - name: receiver-email
          in: query
          schema:
            type: string
            format: email
            maxLength: 256
          description: Receiver email address.
        - name: receiver-ip
          in: query
          schema:
            type: string
            pattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$'
          description: IP address of the receiver.
        - name: receiver-id
          in: query
          schema:
            type: string
            maxLength: 40
          description: ID of the receiver.
        - name: receiver-group-id
          in: query
          schema:
            type: string
            maxLength: 64
          description: 'Customer group service identifier. (eg.: shared data service)'
        - name: receiver-phone-number
          in: query
          description: 'Phone number of the receiver, if the communication type is SMS.'
          schema:
            type: string
            pattern: '^36[0-9]{9}$|^(?!36)[0-9]{10,20}$'
          example: '36201234567'
        - name: sender-email
          in: query
          schema:
            type: string
            format: email
            maxLength: 256
          description: Sender address of email, if the communication type is email
        - name: sender-id
          in: query
          schema:
            type: string
            maxLength: 40
          description: ID of the sender.
        - name: sender-phone-number
          in: query
          description: 'Phone number of the sender, if the communication type is SMS.'
          schema:
            type: string
            pattern: '^(\\+|\\d)[0-9]{1,19}$'
          example: '36201234567'
        - name: start-date
          in: query
          schema:
            type: string
            format: date
          description: 'The start date, must be used together with `end_date`.'
        - name: end-date
          in: query
          schema:
            type: string
            format: date
          description: 'The end date, must be used together with `start_date`.'
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
          description: The start item number for pagination.
        - name: count
          in: query
          schema:
            type: integer
            minimum: 0
          description: The end initiator item number for pagination.
        #header
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Msg_ctx_src'
        - $ref: '#/components/parameters/Msg_ctx_src_module'
        - $ref: '#/components/parameters/Msg_ctx_env'
        - $ref: '#/components/parameters/Msg_ctx_id'
        - $ref: '#/components/parameters/Msg_ctx_corr_id'
        - $ref: '#/components/parameters/Msg_ctx_build_number'
      responses:
        '200':
          description: list of filtered communication messages
          headers:
            Count-Reached:
              description: it defines that the requested number of elements in the query exceeds the response result set (true) or not (false)
              schema:
                type: boolean
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunicationMessageQuery'
        '204':
          description: No content
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
        '400':
          description: Bad Request
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Error
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
    post:
      operationId: creates one or more new CommunicationMessage and send it
      summary: Creates one or more 'CommunicationMessage' and send it
      tags:
        - communicationMessage
      parameters:
        - name: sync-request
          in: header
          schema:
            type: boolean
            default: false
          description: Whether to wait for and return the result in the response.
        #header
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Msg_ctx_src'
        - $ref: '#/components/parameters/Msg_ctx_src_module'
        - $ref: '#/components/parameters/Msg_ctx_env'
        - $ref: '#/components/parameters/Msg_ctx_id'
        - $ref: '#/components/parameters/Msg_ctx_corr_id'
        - $ref: '#/components/parameters/Msg_ctx_build_number'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CommunicationMessageRequest'
            examples:
              sms:
                value:
                  - origId: mess1324
                    context: CTX22
                    description: campaign sms
                    messageType: SMS
                    sendTime: "2025-10-21T20:59:59.999+01:00"
                    receiver:
                      phoneNumber: "36201234567"
                    characteristic: 
                      - {name: "AccountType", value: "PRB"}
                      - {name: "name", value: "Béla"}
              email:
                value:
                  - origId: mess1324
                    context: CTX22
                    description: campaign email
                    messageType: EMAIL
                    sendTime: "2025-10-21T20:59:59.999+01:00"
                    attachment:
                      - {content: "SGVsbG8gV29ybGQh",  mimeType: "text/plain",  name: "text.txt"}
                    receiver:
                      email: "user@example.com"
                    sender:
                      email: "noreply@yettel.hu"
                    characteristic: 
                      - {name: "AccountType", value: "PRB"}
                      - {name: "name", value: "Béla"}
        description: The Communication Message to be created and sent
        required: true
      responses:
        '201':
          description: Created
          headers:
            location:
              $ref: '#/components/headers/Location'
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
        '400':
          description: Bad Request
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Error
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
