  /incoming-SMS:
    get:
      operationId: listIncomingCommunicationMessage
      summary: List incoming communication (SMS)
      tags:
        - incomingSMS
      parameters:
        - name: count
          required: true
          in: query
          description: Requested number of resources to be provided in response.
          schema:
            type: integer
            minimum: 1
        - name: courier_number
          required: true
          in: query
          description: Futarszam.
          schema:
            type: string
            pattern: '^36[0-9]{9}$'
            example: '36201234567'
        - name: original_request
          in: header
          schema:
            type: boolean
            default: true
          description: It defines that the request was the first initiation with the given msgcntx_id.
        #header
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Msg_ctx_src'
        - $ref: '#/components/parameters/Msg_ctx_src_module'
        - $ref: '#/components/parameters/Msg_ctx_env'
        - $ref: '#/components/parameters/Msg_ctx_id'
        - $ref: '#/components/parameters/Msg_ctx_corr_id'
        - $ref: '#/components/parameters/Msg_ctx_build_number'
      responses:
        '200':
          description: CCHUB provide the requested number of incoming communication items.
          headers:
            count-reached:
              description: it defines that the requested number of elements in the query exceeds the response result set (true) or not (false)
              schema:
                type: boolean
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomingSMSs'
        '204':
          description: No content
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
        '400':
          description: Bad Request
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          headers:
            msg-ctx-src:
              $ref: '#/components/headers/Msg_ctx_src'
            msg-ctx-src-module:
              $ref: '#/components/headers/Msg_ctx_src_module'
            msg-ctx-env:
              $ref: '#/components/headers/Msg_ctx_env'
            msg-ctx-id:
              $ref: '#/components/headers/Msg_ctx_id'
            msg-ctx-corr-id:
              $ref: '#/components/headers/Msg_ctx_corr_id'
            msg-ctx-build-number:
              $ref: '#/components/headers/Msg_ctx_build_number'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  headers:
    Location:
      description: (mandatory) The id of the newly created object
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{32}$'
        example: "43429a61f5f54ad4aec05a68d28b1350"
    Msg_ctx_src:
      description: (mandatory) Name of the source system, the sender party of the message. This is used primarily for gathering information on services usage. The name should contain a human-readable name of the application
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        example: "LIGW"
    Msg_ctx_src_module:
      description: (optional) Name of the source system’s module which sent the message. Fill only if suitable
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 64
        example: null
    Msg_ctx_env:
      description: (mandatory) Identifier of the environment. If the environment is production, use the value 'PROD'. Otherwise, use any string value which describes the environment (eg. 'UAT2')
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
        example: "PROD"
    Msg_ctx_id:
      description: (mandatory) Unique identifier of the message. The calling party must guarantee this being a unique identifier (UUID, GUID, etc.)
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
        example: "6b5fae5a-da07-4864-9683-ce55207d06af"
    Msg_ctx_corr_id:
      description: (mandatory) It intends to hold a flow (or session) identifier. The flow initiator generates the id, any other party should copy the received id into all subsequent messages/calls inside the flow. Ids should be unique for each and every flow
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
        example: "3385cbdb-8561-48f6-a671-5e271f486a41"
    Msg_ctx_build_number:
      description: (optional) It represents the sender application’s build version
      required: false
      schema:
        type: string
        maxLength: 16
        example: "3.0.1"
  parameters:
    Msg_ctx_src:
      name: msg-ctx-src
      description: Name of the source system, the sender party of the message. This is used primarily for gathering information on services usage. The name should contain a human-readable name of the application
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        example: "INODE"
    Authorization:
      name: authorization
      description: 'Basic authentication credentials. Format: "Basic {credentials}", where {credentials} is the Base64-encoded string of "username:password".'
      in: header
      required: true
      schema:
        type: string
        minLength: 11
        maxLength: 720
        example: 'Basic YWRtaW46cGFzc3dvcmQ='
    Msg_ctx_src_module:
      name: msg-ctx-src-module
      description: Optional, name of the source system’s module which sent the message. Fill only if suitable
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        example: "INode6 SIP AS"
    Msg_ctx_env:
      name: msg-ctx-env
      description: Identifier of the environment. If the environment is production, use the value 'PROD'. Otherwise, use any string value which describes the environment (eg. 'UAT2')
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
        example: "PROD"
    Msg_ctx_id:
      name: msg-ctx-id
      description: Unique identifier of the message. The calling party must guarantee this being a unique identifier (UUID, GUID, etc.)
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
        example: "53329a61-f5f5-4ad4-aec0-5a68d28b1350"
    Msg_ctx_corr_id:
      name: msg-ctx-corr-id
      description: It intends to hold a flow (or session) identifier. The flow initiator generates the id, any other party should copy the received id into all subsequent messages/calls inside the flow. Ids should be unique for each and every flow
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
        example: "3385cbdb-8561-48f6-a671-5e271f486a41"
    Msg_ctx_build_number:
      name: msg-ctx-build-number
      description: It represents the sender application’s build version
      in: header
      required: false
      schema:
        type: string
        maxLength: 16
        example: "6.0.1-pre"
  schemas:
    BaseCommunicationMessage:
      type: object
      description: 'Communication message means a notification approach in the format of a message which can be dispatched (sent) to the certain user by the system with the content which can be felt and understood by the recipient. The user can be either a final customer or a customer service agent. The message can reach the customer in different interaction channels, including: email, short message, mobile app notification (push).'
      properties:
        origId:
          type: string
          description: identifier of the Communication Message in the sender side.
          minLength: 1
          maxLength: 64
          example: mess1324
        context:
          type: string
          description: The message context.
          minLength: 1
          maxLength: 64
          example: CTX22
        description:
          type: string
          minLength: 1
          maxLength: 64
          description: Reason/description for the communication request initiation.
          example: campaign
        messageType:
          type: string
          description: |
            Defines the delivery channel for the Communication Message.
             1: SMS
             2: Email
             3: Mobile app push notification
             4: Inbox for mobile app
          enum:
            - SMS
            - EMAIL
            - PUSH
            - INBOX
          example: SMS
        sendTime:
          type: string
          format: date-time
          description: The timestamp of the communication request initiation by the initiator application.
          example: '2020-02-10T15:13:45.308+01:00'
        content:
          oneOf:
            - $ref: '#/components/schemas/SmsContent'
            - $ref: '#/components/schemas/EmailContent'
            - $ref: '#/components/schemas/PushContent'
            - $ref: '#/components/schemas/InboxContent'
          discriminator:
            propertyName: messageType
            mapping:
              SMS: '#/components/schemas/SmsContent'
              EMAIL: '#/components/schemas/EmailContent'
              PUSH: '#/components/schemas/PushContent'
              INBOX: '#/components/schemas/InboxContent'
        attachment:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        deliveryNoteReq:
          type: boolean
          description: Delivery note is required or not (channel specific).
          example: true
        readNoteReq:
          type: boolean
          description: Delivery note is required or not (channel specific).
          example: true
        priority:
          type: integer
          format: int32
          description: The priority of the communication message. Small number means higher priority.
          minimum: 1
          maximum: 999
          example: 5
        receiver:
          $ref: '#/components/schemas/Recipient'
        sender:
          $ref: '#/components/schemas/Sender'
        consent:
          type: array
          description: |
            required consent IDs. Available values
            - noSecret
            - noSecretAddressFull
            - noSecretAddressPart
            - displayInDirectory
            - informationOnPost
            - informationOnTelco
            - useForMarketing
          items:
            type: string
            maxLength: 64
            example: informationOnTelco
        contexRelParam:
          $ref: '#/components/schemas/ContextRelParams'
        characteristic:
          type: array
          items:
            $ref: '#/components/schemas/CommunicationMessageCharacteristic'
          example:
          - name: language
            value: hungarian
          - name: param1
            value: Béla
    CommunicationMessageRequest:
      type: object
      description: 'Communication message means a notification approach in the format of a message which can be dispatched (sent) to the certain user by the system with the content which can be felt and understood by the recipient. The user can be either a final customer or a customer service agent. The message can reach the customer in different interaction channels, including: email, short message, mobile app notification (push).'
      allOf:
        - $ref: '#/components/schemas/BaseCommunicationMessage'
        - type: object
          properties:
            href:
              type: string
              format: uri
              maxLength: 256
              description: Hypertext Reference of the Communication Message

    CommunicationMessageQuery:
      type: object
      description: 'Communication message means a notification approach in the format of a message which can be dispatched (sent) to the certain user by the system with the content which can be felt and understood by the recipient. The user can be either a final customer or a customer service agent. The message can reach the customer in different interaction channels, including: email, short message, mobile app notification (push).'
      allOf:
        - $ref: '#/components/schemas/BaseCommunicationMessage'
        - type: object
          properties:
            id:
              type: string
              description: CCHUB created Unique identifier of a Communication Message. In case of POST it must not be sent.
              maxLength: 64
              example: JKHSd85S3
            sendTimeComplete:
              type: string
              format: date-time
              description: The time moment of delivering the communication message successfully. If delivery was not successful it should be filled too.
              example: '2020-02-10T15:14:45.308+01:00'
            state:
              type: string
              description: Status of communication message
              enum:
                - CREATED
                - PROCESSING
                - DELIVERED
                - FAILED
                - SENT
                - WAITING
                - ABSORBED
                - INVALID
                - READ
              example: DELIVERED

    Attachment:
      type: object
      description: 'Complements the description of an element (for instance a product) through video, pictures...'
      properties:
        attachmentType:
          type: string
          maxLength: 16
          description: Attachment type such as video, picture
          example: video
        description:
          type: string
          description: A narrative text describing the content of the attachment
          maxLength: 64
          example: Yettel logo
        content:
          type: string
          format: base64
          description: The actual contents of the attachment object, if embedded, encoded as base64
        href:
          type: string
          format: uri
          maxLength: 256
          description: Reference of the attachment
        id:
          type: string
          maxLength: 64
          description: Unique identifier of the attachment
        mimeType:
          type: string
          maxLength: 128
          description: The mime type of the document as defined in RFC 2045 and RFC 2046 specifications.
        name:
          type: string
          maxLength: 32
          description: The name of the file
        size:
          type: integer
          description: 'The size of the file (sizeUnit if present indicates the unit, otherwise kilobytes is the default).'
        sizeUnit:
          type: string
          description: 'The unit size for expressing the size of the file (MB,kB...)'
        url:
          type: string
          format: uri
          maxLength: 256
          description: 'Uniform Resource Locator, is a web page address (a subset of URI)'
        validity:
          $ref: '#/components/schemas/TimePeriod'
    RelatedParty:
      type: "object"
      properties:
        id:
          type: "string"
          description: "Unique identifier of the customer/person. if @referredType is customer, this refers to customer id , if @referredType is person then person id"
        href:
          type: "string"
          description: "Reference of the related entity."
        name:
          type: "string"
          description: "Name of the related entity."
        role:
          type: "string"
          description: "Role played by the related party"
        '@baseType':
          type: "string"
          description: "When sub-classing, this defines the super-class"
        '@schemaLocation':
          type: "string"
          description: "A URI to a JSON-Schema file that defines additional attributes and relationships"
          format: "uri"
        '@type':
          type: "string"
          description: "When sub-classing, this defines the sub-class entity name"
        '@referredType':
          type: "string"
          default: "customer"
          description: "The type of party (only 'customer' supported)."
          enum:
          - "customer"
          - "individual"
      description: "Related Entity reference. A related party defines party or party role linked to a specific entity."
    Recipient:
      type: object
      description: Receiver of the communication message
      properties:
        appUserId:
          type: string
          maxLength: 256
          description: ID of the mobile app user or push token
        email:
          type: string
          format: email
          maxLength: 256
          description: Receiver email address.
        ip:
          type: string
          pattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$'
          description: IP address of the receiver.
        id:
          type: string
          maxLength: 40
          description: ID of the receiver.
        groupId:
          type: string
          maxLength: 64
          description: 'Customer group service identifier. (eg.: shared data service)'
        name:
          type: string
          maxLength: 128
          description: Name of the receiver.
        phoneNumber:
          type: string
          description: 'Phone number of the receiver, if the communication type is SMS.'
          pattern: '^36[0-9]{9}$|^(?!36)[0-9]{10,20}$'
          example: '36201234567'
        party:
          $ref: "#/components/schemas/RelatedParty"
    Sender:
      type: object
      description: Sender of the communication message. At least 1 element is mandatory to be filled.
      properties:
        email:
          type: string
          format: email
          maxLength: 256
          description: Sender address of email, if the communication type is email
        id:
          type: string
          maxLength: 40
          description: ID of the sender.
        name:
          type: string
          maxLength: 128
          description: Name of the sender.
        phoneNumber:
          type: string
          description: 'Phone number of the sender, if the communication type is SMS.'
          pattern: '^(\\+|\\d)[0-9]{1,19}$'
          example: '36201234567'
    CommunicationMessageCharacteristic:
      type: object
      description: 'This object describe other delivery related parameters and their values (eg.: MPGCode, Template parameter name and value). Name should be unique'
      required:
        - name
        - value
      properties:
        name:
          type: string
          description: Name of the characteristic.
        value:
          description: Flexible value holder (scalar/object/array)
          oneOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
            - type: object
            - type: array
              items:
                type: object
    SmsContent:
      type: array
      items:
        type: object
        description: 'Key-value pair, which contains the part number of messages and its text. Relevant in case of chain messages.'
        properties:
          messagePartNum:
            type: integer
            minimum: 1
            description: Content parameter identifier. It is relevant in case of SMS.
          text:
            type: string
            maxLength: 160
            description: Content text
    EmailContent:
      type: object
      properties:
        body:
          type: string
          format: base64
          description: "Valid for all communication type when content is generated by consumer system that has internal content generator. If this parameter is used, no content is rendered by CGW. Currently only base64 encoded text/html, text/plain"
        characterSetCode:
          type: string
          enum: [UTF-8]
          description: "Media character set before encoding if applicable. Currently only 'UTF-8' is supported at server side. Fixed value: 'UTF-8'"
        bodyFormat:
          type: string
          enum: [text/html]
          description: "Media type/subtype before transfer encoding"
        subject:
          type: string
          description: "The title of the message. It is necessary for the email (maxLength: 78) and mobile app push (maxLength: 64)."
          minLength: 1
          maxLength: 78
          example: Lejárt számlatartozás
    PushContent:
      type: object
      description: 'Key-value pair, which contains the part number of messages and its text. Relevant in case of chain messages.'
      properties:
        title:
          type: string
        body:
          type: string
          maxLength: 160
          description: Content text
        deeplinkUri:
          type: string
    InboxContent:
      type: object
      description: 'Key-value pair, which contains the part number of messages and its text. Relevant in case of chain messages.'
      properties:
        messagePartNum:
          type: integer
          minimum: 1
          description: Content parameter identifier. It is relevant in case of SMS.
        text:
          type: string
          maxLength: 160
          description: Content text
        content:
          type: string
          format: base64
          description: "Valid for all communication type when content is generated by consumer system that has internal content generator. If this parameter is used, no content is rendered by CGW. Currently only base64 encoded text/html, text/plain"
        characterSetCode:
          type: string
          description: "Media character set before encoding if applicable. Currently only 'UTF-8' is supported at server side.fixed value: 'UTF-8'"
    TimePeriod:
      type: object
      description: A base / value business entity used to represent a period of time between two timepoints.
      properties:
        startDateTime:
          type: string
          format: date-time
          description: 'An instant of time, starting at the TimePeriod'
        endDateTime:
          type: string
          format: date-time
          description: 'An instant of time, ending at the TimePeriod.'
    ContextRelParams:
      type: object
      description: Context related parameters.
      properties:
        deliveryWindow:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryWindow'
        retryTimes:
          type: integer
          minimum: 0
          maximum: 10
          description: How many times (pc) it is need to be resend in case of unsuccessful delivery.
        retryDelay:
          type: integer
          minimum: 1
          maximum: 1440
          description: How many time (in minutes) should pass after an unsucessful delivery before retry again.
        validTill:
          type: string
          format: date-time
          description: The relevancy of the communication message.
        validFrom:
          type: string
          format: date-time
          description: The beginning of the relevancy of the communication message.
        retentionTime:
          type: string
          format: date-time
          description: The datetime till communication message should be stored.
    DeliveryWindow:
      type: object
      properties:
        dateCategory:
          type: string
          description: Category of the date
          enum:
            - Workday
            - Holiday
            - Weekend
        periodFrom:
          type: integer
          minimum: 0
          maximum: 23
          description: Time window start (value in hour)
          example: 9
        periodFromMin:
          type: integer
          minimum: 0
          maximum: 59
          description: Minute part of the Time window start
          example: 0
        periodTo:
          type: integer
          minimum: 0
          maximum: 23
          description: Time window end (value in hour)
          example: 16
        periodToMin:
          type: integer
          minimum: 0
          maximum: 59
          description: Minute part of the Time window end
          example: 55
    IncomingSMSs:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
          description: The unique identifier of the received message.
        content:
          $ref: '#/components/schemas/SmsContent'
        msisdn:
          type: string
          description: Initiator customer MSISDN.
          pattern: '^36[0-9]{9}$'
          example: '36201234567'
        received:
          type: string
          format: date-time
          description: The time moment when CCHUB received the message from the customer.
    Detail:
      description: A human-readable explanation specific to this occurrence of the problem
      type: string
    Error:
      description: Basic result object
      type: object
      required:
        - title
        - status
        - cause
      properties:
        title:
          description: A short, human-readable summary of the problem type in case of http status 500
          type: string
          example: "Internal server error"
        status:
          description: The HTTP status code generated by the origin server for this occurrence of the problem
          type: number
          example: 500
        cause:
          description: A machine-readable application error cause specific to this occurrence of the problem in case of http status 500
          type: string
          example: "SERVER_ERROR"
        detail:
          $ref: '#/components/schemas/Detail'