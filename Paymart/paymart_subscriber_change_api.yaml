    Msg_ctx_build_number:
      description: It represents the sender application’s build version
      required: false
      schema:
        type: string
        maxLength: 16
        example: 3.0.1
  parameters:
    Msg_ctx_src:
      name: Msg-Ctx-Src
      description: "Name of the source system, the sender party of the message. This is used primarily for gathering information on services usage. The name should contain a human-readable name of the application"
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        example: INODE
    Msg_ctx_src_module:
      name: Msg-Ctx-Src-Module
      description: "Optional, name of the source system’s module which sent the message. Fill only if suitable"
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 64
        example: INode6 SIP AS
    Msg_ctx_env:
      name: Msg-Ctx-Env
      description: "Identifier of the environment. If the environment is production, use the value 'PROD'. Otherwise, use any string value which describes the environment (eg. 'UAT2')"
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
        example: PROD
    Msg_ctx_id:
      name: Msg-Ctx-Id
      description: "Unique identifier of the message. The calling party must guarantee this being a unique identifier (UUID, GUID, etc.)"
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
        example: 53329a61-f5f5-4ad4-aec0-5a68d28b1350
    Msg_ctx_corr_id:
      name: Msg-Ctx-Corr-Id
      description: "It intends to hold a flow (or session) identifier. The flow initiator generates the id, any other party should copy the received id into all subsequent messages/calls inside the flow. Ids should be unique for each and every flow"
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 40
        example: 3385cbdb-8561-48f6-a671-5e271f486a41
    Msg_ctx_build_number:
      name: Msg-Ctx-Build-Number
      description: It represents the sender application’s build version
      in: header
      required: false
      schema:
        type: string
        maxLength: 16
        example: "14393.693"
  schemas:
    SubscriberChange:
      type: object
      required:
      - subsId
      - msisdn
      properties:
        subsId:
          type: number
          description: Subscriber identity in MCSIS system
          example: 12345
        msisdn:
          type: string
          pattern: "[0-9]{3,31}"
          description: MSISDN
          example: "36201234567"
        stickyBitDateTime:
          type: string
          format: date-time
          description: sticky bit datetime
          example: "2025-04-30T13:03:57.300Z"
    ErrorResult:
      description: Basic result object
      type: object
      required:
        - title
        - status
        - cause
      properties:
        title:
          description: A short, human-readable summary of the problem type in case of http status 500
          type: string
          enum: ["Internal server error", "Bad request", "Not found"]
          example: "Internal server error"
        status:
          description: The HTTP status code generated by the origin server for this occurrence of the problem
          type: number
          example: 500
        cause:
          description: A machine-readable application error cause specific to this occurrence of the problem in case of http status 500
          type: string
          enum: [INTERNAL_SERVER_ERROR, BAD_REQUEST]
          example: "INTERNAL_SERVER_ERROR"
        detail:
          description: A human-readable explanation specific to this occurrence of the problem
          type: string
          example: "detail"