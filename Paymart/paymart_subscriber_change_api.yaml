openapi: 3.0.4
servers:
- description: Test environment
  url: https:/payamrt-uat.pgsm.hu:1234
info:
  description: |
    The purpose of this documentation is to summarize and specify in detail the Paymar Subscriber change interface.
  version: "1.0"
  title: Paymart Subscriber change API
  contact:
    email: aweimann@verisis.hu
tags:
  - name: Subs
    description: Subscriber
paths:
  /api/v1/paymart/subs/change:
    post:
      tags:
        - Subs
      summary: Subscriber change
      operationId: subscriber-change
      description: An account/SIM is transferred to another person (ownership change) or a subscriber has cancelled their account and the recycling period is less than the business unit’s churn period.
      parameters:
      - name: Msg-Ctx-Src
        description: "Name of the source system, the sender party of the message. This is used primarily for gathering information on services usage. The name should contain a human-readable name of the application"
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          example: MCSIS
      - name: Msg-Ctx-Src-Module
        description: "Optional, name of the source system’s module which sent the message. Fill only if suitable"
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 64
          example: PaymartComm
      - name: Msg-Ctx-Env
        description: "Identifier of the environment. If the environment is production, use the value 'PROD'. Otherwise, use any string value which describes the environment (eg. 'UAT2')"
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 32
          example: PROD
      - name: Msg-Ctx-Id
        description: "Unique identifier of the message. The calling party must guarantee this being a unique identifier (UUID, GUID, etc.)"
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 40
          example: 53329a61-f5f5-4ad4-aec0-5a68d28b1350
      - name: Msg-Ctx-Corr-Id
        description: "It intends to hold a flow (or session) identifier. The flow initiator generates the id, any other party should copy the received id into all subsequent messages/calls inside the flow. Ids should be unique for each and every flow"
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 40
          example: 3385cbdb-8561-48f6-a671-5e271f486a41
      - name: Msg-Ctx-Build-Number
        description: It represents the sender application’s build version
        in: header
        required: false
        schema:
          type: string
          maxLength: 16
          example: "14393.693"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriberChange'
        description: Subscriber change request
      responses:
        "204":
          description: No content
          headers:
            Msg-Ctx-Rrid:
              description: "In case of regular responses, this field must contain the ID of the message, which to it answers. Messaging infrastructure permits the usage of multiple answers for the same request. The specific service / interface definitions should mark if this capability is used by the actual implementation"
              required: true
              schema:
                type: string
                minLength: 1
                maxLength: 40
                example: 53329a61-f5f5-4ad4-aec0-5a68d28b1350
            Msg-Ctx-Src:
              description: "Name of the source system, the sender party of the message. This is used primarily for gathering information on services usage. The name should contain a human-readable name of the application"
              required: true
              schema:
                type: string
                minLength: 1
                maxLength: 64
                example: LIGW
            Msg-Ctx-Src-Module:
              description: "Optional, name of the source system’s module which sent the message. Fill only if suitable"
              required: false
              schema:
                type: string
                minLength: 1
                maxLength: 64
                example: null
            Msg-Ctx-Env:
              description: "Identifier of the environment. If the environment is production, use the value 'PROD'. Otherwise, use any string value which describes the environment (eg. 'UAT2')"
              required: true
