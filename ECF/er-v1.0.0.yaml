openapi: 3.0.3
info:
  title: ECF MobileApp REST API
  version: 1.0.0
  description: 'Initial consolidated OpenAPI 3.0.3 contract draft for the ECF MobileApp REST API.


    This contract is a consensus-building working draft. Unknown JSON request properties are ignored by the backend for forward compatibility. The formal v1.0.0 change list will be finalized before approval submission.'
servers:
- url: https://ecf-api.example.hu/mobileapp/v1
  description: Placeholder production server
tags:
- name: Application
  description: Application version, upgrade, and planned-outage information
- name: UserManagement
  description: User login, token, Airship push data, and session management
- name: Parking
  description: Parking transactions, parking start/stop, history, and parking information
- name: Vignette
  description: Highway vignette purchase and history
- name: Vehicle
  description: Vehicle management
paths:
  /app/info:
    get:
      tags:
      - Application
      operationId: getAppInfo
      summary: Get application status and version information
      description: Returns mobile-application upgrade information and an optional planned outage window. This bootstrap endpoint
        is intentionally available before login so that a client can display a forced-upgrade or maintenance message even
        when no user session exists.
      parameters:
      - $ref: '#/components/parameters/msgcntx_src'
      - $ref: '#/components/parameters/msgcntx_id'
      - $ref: '#/components/parameters/msgcntx_env'
      - $ref: '#/components/parameters/msgcntx_ts'
      - $ref: '#/components/parameters/msgcntx_vrs'
      - $ref: '#/components/parameters/msgcntx_lang'
      responses:
        '200':
          description: Application information
          headers:
            msgcntx_id:
              $ref: '#/components/headers/msgcntx_id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInfoData'
              example:
                hasNewVersion: true
                forceUpgrade: true
                newVersion: '2.0.0'
                notification: Telepítsd az új verziót, hogy használhasd a Mobiljegyet
                outageStart: '2026-04-04T22:00:00.000Z'
                outageEnd: '2026-04-04T23:00:00.000Z'
                outageMessage: Karbantartást végzünk, gyere vissza később
        '400':
          $ref: '#/components/responses/BadRequestEnvelope'
        '500':
          $ref: '#/components/responses/InternalErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailableEnvelope'
  /user/login:
    post:
      tags:
      - UserManagement
      operationId: userLogin
      summary: Start login or registration
      description: Starts login/registration by MSISDN and initiates delivery of a new eight-character alphanumeric OTP. The
        OTP is valid for three minutes. To request a new OTP, the client calls this operation again with the same MSISDN already
        known by the client; the backend creates a new loginId and OTP and invalidates the previous unfinished login flow
        for the same account/device. Only one login flow may be active for an account/device pair.
      parameters:
      - $ref: '#/components/parameters/msgcntx_src'
      - $ref: '#/components/parameters/msgcntx_id'
      - $ref: '#/components/parameters/msgcntx_env'
      - $ref: '#/components/parameters/msgcntx_ts'
      - $ref: '#/components/parameters/msgcntx_vrs'
      - $ref: '#/components/parameters/msgcntx_lang'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              msisdn: '36201234567'
      responses:
        '201':
          description: Login flow initialized
          headers:
            msgcntx_id:
              $ref: '#/components/headers/msgcntx_id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginInitData'
              example:
                userId: '100200'
                loginId: 20260603001
                loginExpiry: '2026-06-03T12:03:00Z'
        '400':
          $ref: '#/components/responses/BadRequestEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundEnvelope'
        '409':
          $ref: '#/components/responses/ConflictEnvelope'
        '500':
          $ref: '#/components/responses/InternalErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailableEnvelope'
  /user/{userId}/login/{loginId}:
    post:
      tags:
      - UserManagement
      operationId: verifyLoginOtp
      summary: Verify login OTP
      description: Finalizes login by verifying the eight-character alphanumeric OTP and issues the session and refresh tokens.
        This endpoint is intentionally unauthenticated because it creates the session. The OTP is valid for three minutes
        and a maximum of three failed verification attempts is allowed for a login flow.
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/loginId'
      - $ref: '#/components/parameters/msgcntx_src'
      - $ref: '#/components/parameters/msgcntx_id'
      - $ref: '#/components/parameters/msgcntx_env'
      - $ref: '#/components/parameters/msgcntx_ts'
      - $ref: '#/components/parameters/msgcntx_vrs'
      - $ref: '#/components/parameters/msgcntx_lang'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerificationRequest'
            example:
              code: A7B9C2D4
      responses:
        '200':
          description: Session created
          headers:
            msgcntx_id:
              $ref: '#/components/headers/msgcntx_id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionData'
              example:
                userId: '100200'
                sessionToken: ey...token_data...
                tokenExpiry: '2026-06-03T14:00:00Z'
                refreshToken: refresh...data...
                refreshTokenExpiry: '2026-06-06T12:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequestEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundEnvelope'
        '409':
          $ref: '#/components/responses/ConflictEnvelope'
        '500':
          $ref: '#/components/responses/InternalErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailableEnvelope'
  /user/{userId}/refresh:
    post:
      tags:
      - UserManagement
      operationId: refreshToken
      summary: Refresh session token
      description: Refreshes the session token. Both the msgcntx_token header and the request-body refreshToken are mandatory.
        The session token may already be expired. The backend validates account/device binding and the refresh token. A successful
        refresh issues a new two-hour session token and rotates the refresh token; the previous refresh token becomes invalid.
        A refresh token is valid for at most 72 hours from its current issue time. Reuse of an already rotated refresh token
        revokes the token family for the affected account/device session and requires a new login. Multiple concurrently active
        session families are allowed; refresh affects only the family identified by the presented session and refresh tokens.
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/msgcntx_src'
      - $ref: '#/components/parameters/msgcntx_id'
      - $ref: '#/components/parameters/msgcntx_env'
      - $ref: '#/components/parameters/msgcntx_ts'
      - $ref: '#/components/parameters/msgcntx_vrs'
      - $ref: '#/components/parameters/msgcntx_lang'
      - $ref: '#/components/parameters/msgcntx_token'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          headers:
            msgcntx_id:
              $ref: '#/components/headers/msgcntx_id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionData'
              example:
                userId: '100200'
                sessionToken: ey...new_token_data...
                tokenExpiry: '2026-06-03T16:00:00Z'
                refreshToken: refresh...rotated_data...
                refreshTokenExpiry: '2026-06-06T14:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequestEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundEnvelope'
        '409':
          $ref: '#/components/responses/ConflictEnvelope'
        '500':
          $ref: '#/components/responses/InternalErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailableEnvelope'
  /user/{userId}/logout:
    post:
      tags:
      - UserManagement
      operationId: userLogout
      summary: Logout
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/msgcntx_src'
      - $ref: '#/components/parameters/msgcntx_id'
      - $ref: '#/components/parameters/msgcntx_env'
      - $ref: '#/components/parameters/msgcntx_ts'
      - $ref: '#/components/parameters/msgcntx_vrs'
      - $ref: '#/components/parameters/msgcntx_lang'
      - $ref: '#/components/parameters/msgcntx_token'
      responses:
        '200':
          description: Logout processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckData'
          headers:
            msgcntx_id:
              $ref: '#/components/headers/msgcntx_id'
        '400':
          $ref: '#/components/responses/BadRequestEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundEnvelope'
        '409':
          $ref: '#/components/responses/ConflictEnvelope'
        '500':
          $ref: '#/components/responses/InternalErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailableEnvelope'
      description: Logs out the current session. The backend immediately invalidates the presented session token and the complete
        refresh-token family belonging to that session. Other concurrently active sessions for the account, whether on the
        same or another device, remain valid.
  /user/{userId}/push-registration:
    post:
      tags:
      - UserManagement
      operationId: registerPushData
      summary: Register Airship push data
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/msgcntx_src'
      - $ref: '#/components/parameters/msgcntx_id'
      - $ref: '#/components/parameters/msgcntx_env'
      - $ref: '#/components/parameters/msgcntx_ts'
      - $ref: '#/components/parameters/msgcntx_vrs'
      - $ref: '#/components/parameters/msgcntx_lang'
      - $ref: '#/components/parameters/msgcntx_token'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AirshipRegistrationRequest'
            example:
              channelId: "8f650728-5959-4c44-89c7-4c1dba5e2890"
              namedUser: "DXL által kódolt MSISDN"
              platform: "ANDROID"
      responses:
        '200':
          description: Airship push registration stored
          headers:
            msgcntx_id:
              $ref: '#/components/headers/msgcntx_id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckData'
        '400':
          $ref: '#/components/responses/BadRequestEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundEnvelope'
        '409':
          $ref: '#/components/responses/ConflictEnvelope'
        '500':
          $ref: '#/components/responses/InternalErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailableEnvelope'
      description: >
        Creates or replaces the Airship registration associated with the authenticated user and the msgcntx_src application installation.
        The registration contains the Airship channel ID, the DXL-encoded MSISDN used as named user, and the client platform.
  /user/{userId}/transactions/parking:
    get:
      tags:
      - Parking
      operationId: getParkingHistory
      summary: Get parking history
      description: Returns active/relevant and archived parking transactions with count/offset pagination. A user may have
        zero, one, or multiple active parking transactions. The client determines active parking from each item's `parkingDetails.status`
        and `parkingDetails.isFinished` values; there is no separate active-parking endpoint.
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/count'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/msgcntx_src'
      - $ref: '#/components/parameters/msgcntx_id'
      - $ref: '#/components/parameters/msgcntx_env'
      - $ref: '#/components/parameters/msgcntx_ts'
      - $ref: '#/components/parameters/msgcntx_vrs'
      - $ref: '#/components/parameters/msgcntx_lang'
      - $ref: '#/components/parameters/msgcntx_token'
      responses:
        '200':
          description: Parking transactions
          headers:
            msgcntx_id:
              $ref: '#/components/headers/msgcntx_id'
            count-reached:
              $ref: '#/components/headers/count-reached'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingHistoryData'
              example:
                - msisdn: '36201234567'
                  ecfId: 12434264
                  nmfrId: 6SHD86SAD6
                  trxStart: '2026-06-05T20:22:21.728Z'
                  trxEnd: '2026-06-05T20:22:21.728Z'
                  parkingDetails:
                    status: STOPPED
                    startTime: '2026-06-05T20:22:21.728Z'
                    endTime: '2026-06-05T20:22:21.728Z'
                    expectedEndTime: '2026-06-05T20:22:21.728Z'
                    chargeEndTime: '2026-06-05T20:22:21.728Z'
                    vehicle:
                      licensePlateNumber: LYNGMYRZO
                      countryCode: XCI
                      category: CAR
                      name: name
                    isFinished: true
                    zoneInfo:
                      zoneName: string
                      zoneTarif: string
                      isEstimatedTarif: true
                      isFixTicketZone: true
                      zoneType: ONSITE
                      zoneCode: stri
                      zoneTarifMultiplier: 3500
                      city: string
                    isRecurring: true
                  costInfo:
                    parkingCost: 3500
                    comfortFee: 3500
        '400':
          $ref: '#/components/responses/BadRequestEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundEnvelope'
        '409':
          $ref: '#/components/responses/ConflictEnvelope'
        '500':
          $ref: '#/components/responses/InternalErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailableEnvelope'
    post:
      tags:
      - Parking
      operationId: startParkingSession
      summary: Start parking session
      description: 'Starts a parking transaction immediately or, when startTime is supplied, schedules it for later. The selected
        zoneCode and zone data determine the service type: OFFSITE means OP, isFixTicketZone=true means TP, otherwise SSP.
        parkingLength is optional. The request contains no mp PIN or separate idempotency key; msgcntx_id is used for correlation
        and deduplication.'
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/msgcntx_src'
      - $ref: '#/components/parameters/msgcntx_id'
      - $ref: '#/components/parameters/msgcntx_env'
      - $ref: '#/components/parameters/msgcntx_ts'
      - $ref: '#/components/parameters/msgcntx_vrs'
      - $ref: '#/components/parameters/msgcntx_lang'
      - $ref: '#/components/parameters/msgcntx_token'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartParkingRequest'
            example:
              zoneCode: BP-0112
              vehicle:
                licensePlateNumber: ABC123
                countryCode: HUN
                category: CAR
              parkingLength: 60
              isRecurring: false
              startTime: '2026-06-06T08:00:00.000Z'
      responses:
        '201':
          description: Parking created
          headers:
            msgcntx_id:
              $ref: '#/components/headers/msgcntx_id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingTransaction'
              example:
                msisdn: '36201234567'
                ecfId: 12434264
                nmfrId: 6SHD86SAD6
                trxStart: '2026-06-05T20:22:21.728Z'
                trxEnd: '2026-06-05T20:22:21.728Z'
                parkingDetails:
                  status: STOPPED
                  startTime: '2026-06-05T20:22:21.728Z'
                  endTime: '2026-06-05T20:22:21.728Z'
                  expectedEndTime: '2026-06-05T20:22:21.728Z'
                  chargeEndTime: '2026-06-05T20:22:21.728Z'
                  vehicle:
                    licensePlateNumber: LYNGMYRZO
                    countryCode: XCI
                    category: CAR
                    name: name
                  isFinished: true
                  zoneInfo:
                    zoneName: string
                    zoneTarif: string
                    isEstimatedTarif: true
                    isFixTicketZone: true
                    zoneType: ONSITE
                    zoneCode: stri
                    zoneTarifMultiplier: 3500
                    city: string
                  isRecurring: true
                costInfo:
                  parkingCost: 3500
                  comfortFee: 3500
        '400':
          $ref: '#/components/responses/BadRequestEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundEnvelope'
        '409':
          $ref: '#/components/responses/ConflictEnvelope'
        '500':
          $ref: '#/components/responses/InternalErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailableEnvelope'
  /user/{userId}/transactions/parking/{id}:
    get:
      tags:
      - Parking
      operationId: getParkingTransactionById
      summary: Get parking transaction by id
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/transactionId'
      - $ref: '#/components/parameters/msgcntx_src'
      - $ref: '#/components/parameters/msgcntx_id'
      - $ref: '#/components/parameters/msgcntx_env'
      - $ref: '#/components/parameters/msgcntx_ts'
      - $ref: '#/components/parameters/msgcntx_vrs'
      - $ref: '#/components/parameters/msgcntx_lang'
      - $ref: '#/components/parameters/msgcntx_token'
      responses:
        '200':
          description: Parking transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingTransaction'
              example:
                msisdn: '36201234567'
                ecfId: 12434264
                nmfrId: 6SHD86SAD6
                trxStart: '2026-06-05T20:22:21.728Z'
                trxEnd: '2026-06-05T20:22:21.728Z'
                parkingDetails:
                  status: STOPPED
                  startTime: '2026-06-05T20:22:21.728Z'
                  endTime: '2026-06-05T20:22:21.728Z'
                  expectedEndTime: '2026-06-05T20:22:21.728Z'
                  chargeEndTime: '2026-06-05T20:22:21.728Z'
                  vehicle:
                    licensePlateNumber: LYNGMYRZO
                    countryCode: XCI
                    category: CAR
                    name: name
                  isFinished: true
                  zoneInfo:
                    zoneName: string
                    zoneTarif: string
                    isEstimatedTarif: true
                    isFixTicketZone: true
                    zoneType: ONSITE
                    zoneCode: stri
                    zoneTarifMultiplier: 3500
                    city: string
                  isRecurring: true
                costInfo:
                  parkingCost: 3500
                  comfortFee: 3500
          headers:
            msgcntx_id:
              $ref: '#/components/headers/msgcntx_id'
        '400':
          $ref: '#/components/responses/BadRequestEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundEnvelope'
        '409':
          $ref: '#/components/responses/ConflictEnvelope'
        '500':
          $ref: '#/components/responses/InternalErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailableEnvelope'
    delete:
      tags:
      - Parking
      operationId: stopParkingSession
      summary: Stop parking session
      description: Stops an open parking transaction. Repeating the stop for an already closed transaction returns 404 Not
        Found. DELETE is retained as the contract operation.
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/transactionId'
      - $ref: '#/components/parameters/msgcntx_src'
      - $ref: '#/components/parameters/msgcntx_id'
      - $ref: '#/components/parameters/msgcntx_env'
      - $ref: '#/components/parameters/msgcntx_ts'
      - $ref: '#/components/parameters/msgcntx_vrs'
      - $ref: '#/components/parameters/msgcntx_lang'
      - $ref: '#/components/parameters/msgcntx_token'
      responses:
        '200':
          description: Parking stopped
          headers:
            msgcntx_id:
              $ref: '#/components/headers/msgcntx_id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingTransaction'
              example:
                msisdn: '36201234567'
                ecfId: 12434264
                nmfrId: 6SHD86SAD6
                trxStart: '2026-06-05T20:22:21.728Z'
                trxEnd: '2026-06-05T20:22:21.728Z'
                parkingDetails:
                  status: STOPPED
                  startTime: '2026-06-05T20:22:21.728Z'
                  endTime: '2026-06-05T20:22:21.728Z'
                  expectedEndTime: '2026-06-05T20:22:21.728Z'
                  chargeEndTime: '2026-06-05T20:22:21.728Z'
                  vehicle:
                    licensePlateNumber: LYNGMYRZO
                    countryCode: XCI
                    category: CAR
                    name: name
                  isFinished: true
                  zoneInfo:
                    zoneName: string
                    zoneTarif: string
                    isEstimatedTarif: true
                    isFixTicketZone: true
                    zoneType: ONSITE
                    zoneCode: stri
                    zoneTarifMultiplier: 3500
                    city: string
                  isRecurring: true
                costInfo:
                  parkingCost: 3500
                  comfortFee: 3500
        '400':
          $ref: '#/components/responses/BadRequestEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundEnvelope'
        '409':
          $ref: '#/components/responses/ConflictEnvelope'
        '500':
          $ref: '#/components/responses/InternalErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailableEnvelope'
  /parking/info:
    get:
      tags:
      - Parking
      operationId: getParkingInfo
      summary: Get parking configuration and zone database
      description: Returns parking bootstrap configuration and, when requested/needed, the parking-zone database as a base64-encoded
        ZIP archive in zoneInfo. The client may send its known zone_version and control payload inclusion with includeZoneInfo.
      parameters:
      - $ref: '#/components/parameters/includeZoneInfo'
      - $ref: '#/components/parameters/zone_version'
      - $ref: '#/components/parameters/msgcntx_src'
      - $ref: '#/components/parameters/msgcntx_id'
      - $ref: '#/components/parameters/msgcntx_env'
      - $ref: '#/components/parameters/msgcntx_ts'
      - $ref: '#/components/parameters/msgcntx_vrs'
      - $ref: '#/components/parameters/msgcntx_lang'
      - $ref: '#/components/parameters/msgcntx_token'
      responses:
        '200':
          description: Parking information
          headers:
            msgcntx_id:
              $ref: '#/components/headers/msgcntx_id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingInfoData'
              example:
                zoneVersion: '1780480800000'
                zoneInfo: UEsDBBQAAAAIACWrxVxDv6ajBAAAAAIAAAASAAAAem9uZS1kYXRhYmFzZS5qc29uq64FAFBLAQIUAxQAAAAIACWrxVxDv6ajBAAAAAIAAAASAAAAAAAAAAAAAACAAQAAAAB6b25lLWRhdGFiYXNlLmpzb25QSwUGAAAAAAEAAQBAAAAANAAAAAAA
                parkingStopReminder:
                  timeThresholdSec: 300
                  enterThresholdMeter: 100
                comfortFee:
                  startStopParking: 115.0
                  ticketParking: 115.0
                  offsiteParking: 115.0
